name: Video Slicer to Telegram (Pro Auto)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Video URL'
        required: true
      folder_name:
        description: 'Folder Name'
        required: true
      chat_id:
        description: 'Chat ID (Hidden)'
        required: false
      message_id:
        description: 'Message ID (Hidden)'
        required: false
  repository_dispatch:
    types: [stream_trigger]

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "VIDEO_URL=${{ github.event.client_payload.video_url }}" >> $GITHUB_ENV
            echo "FOLDER_NAME=${{ github.event.client_payload.folder_name }}" >> $GITHUB_ENV
            echo "CHAT_ID=${{ github.event.client_payload.chat_id }}" >> $GITHUB_ENV
            echo "MESSAGE_ID=${{ github.event.client_payload.message_id }}" >> $GITHUB_ENV
          else
            echo "VIDEO_URL=${{ github.event.inputs.video_url }}" >> $GITHUB_ENV
            echo "FOLDER_NAME=${{ github.event.inputs.folder_name }}" >> $GITHUB_ENV
            echo "CHAT_ID=${{ github.event.inputs.chat_id }}" >> $GITHUB_ENV
            echo "MESSAGE_ID=${{ github.event.inputs.message_id }}" >> $GITHUB_ENV
          fi

      - name: Install System Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-requests jq
          sudo wget -qO /usr/local/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Update Status (Downloading & Slicing)
        env:
          TG_MANAGER_TOKEN: ${{ vars.TG_MANAGER_TOKEN }}
        run: |
          if [ ! -z "$MESSAGE_ID" ]; then
            JSON_PAYLOAD=$(jq -n --arg chat "$CHAT_ID" --arg msg "$MESSAGE_ID" --arg folder "$FOLDER_NAME" '{
              chat_id: $chat, message_id:$msg, 
              text: "🚀 *Processing Started!*\n📁 Folder: `\($folder)`\n🔪 *Status:* Downloading & Slicing...", 
              parse_mode: "Markdown", 
              reply_markup: {inline_keyboard: [[{text: "❌ Cancel Process", callback_data: "cancel_process"}]]}
            }')
            curl -s -X POST "https://api.telegram.org/bot$TG_MANAGER_TOKEN/editMessageText" -H "Content-Type: application/json" -d "$JSON_PAYLOAD"
          fi

      - name: Download Video File
        run: |
          yt-dlp --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -f "best[ext=mp4]/best" \
            -o "input.mp4" "$VIDEO_URL"

      - name: Slice Video (Direct Copy - Standard)
        run: |
          mkdir -p output
          ffmpeg -y -i input.mp4 -map_metadata -1 -map 0:v:0 -map 0:a:0? -c copy -start_number 0 -hls_time 10 -hls_list_size 0 -hls_segment_filename "output/seg_%03d.jpg" output/playlist.m3u8

      - name: Upload to Telegram (With Live Progress & Cancel Button)
        env:
          TG_BOT_TOKENS: ${{ vars.TG_BOT_TOKENS }}
          TG_UPLOAD_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          TG_MANAGER_TOKEN: ${{ vars.TG_MANAGER_TOKEN }}
        run: |
          python3 -c "
          import os, requests, json, shutil, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from itertools import cycle
          
          TOKENS = os.environ.get('TG_BOT_TOKENS', '').split(',')
          UPLOAD_CHAT_ID = os.environ.get('TG_UPLOAD_CHAT_ID', '')
          FOLDER = os.environ.get('FOLDER_NAME', '')
          MANAGER_TOKEN = os.environ.get('TG_MANAGER_TOKEN', '')
          USER_CHAT_ID = os.environ.get('CHAT_ID', '')
          MSG_ID = os.environ.get('MESSAGE_ID', '')
          
          bot_pool = cycle([t for t in TOKENS if t])
          os.makedirs('db', exist_ok=True)
          output_dir = 'output'
          
          m3u8_file = [f for f in os.listdir(output_dir) if f.endswith('.m3u8')]
          if m3u8_file:
              shutil.copy(f'{output_dir}/{m3u8_file[0]}', f'db/{FOLDER}_playlist.m3u8')
          
          files = sorted([f for f in os.listdir(output_dir) if f.endswith('.jpg')])
          map_data = {}
          total_files = len(files)
          
          def edit_tg_message(text):
              if USER_CHAT_ID and MSG_ID and MANAGER_TOKEN:
                  url = f'https://api.telegram.org/bot{MANAGER_TOKEN}/editMessageText'
                  keyboard = {'inline_keyboard': [[{'text': '❌ Cancel Process', 'callback_data': 'cancel_process'}]]}
                  requests.post(url, json={'chat_id': USER_CHAT_ID, 'message_id': MSG_ID, 'text': text, 'parse_mode': 'Markdown', 'reply_markup': keyboard})
          
          def upload_file(filename):
              file_path = f'{output_dir}/{filename}'
              while True:
                  current_token = next(bot_pool)
                  url = f'https://api.telegram.org/bot{current_token}/sendDocument'
                  with open(file_path, 'rb') as f:
                      resp = requests.post(url, data={'chat_id': UPLOAD_CHAT_ID}, files={'document': f}).json()
                  
                  if resp.get('ok'):
                      return filename, resp['result']['document']['file_id']
                  elif resp.get('error_code') == 429:
                      time.sleep(1) 
                  else:
                      time.sleep(2)
          
          completed = 0
          last_percent = 0
          
          if total_files > 0:
              with ThreadPoolExecutor(max_workers=6) as executor:
                  futures = {executor.submit(upload_file, f): f for f in files}
                  for future in as_completed(futures):
                      filename, file_id = future.result()
                      map_data[filename] = file_id
                      completed += 1
                      
                      percent = int((completed / total_files) * 100)
                      if percent >= last_percent + 5 or completed == total_files:
                          blocks = int(percent / 10)
                          bar = '█' * blocks + '▒' * (10 - blocks)
                          msg = f'🚀 *Processing:* \`{FOLDER}\`\n\n📤 *Uploading:* [{bar}] {percent}%\n📁 *Files:* {completed} / {total_files}'
                          edit_tg_message(msg)
                          last_percent = percent
          
          with open(f'db/{FOLDER}_map.json', 'w') as f:
              json.dump(map_data, f, indent=4)
          "

      - name: Save DB to GitHub Repo
        run: |
          git config --global user.name "Telegram Bot"
          git config --global user.email "bot@github.com"
          git add db/
          git diff --quiet && git diff --staged --quiet || git commit -m "Updated DB for $FOLDER_NAME"
          git pull --rebase origin main
          git push

      - name: Send Final URL (Success)
        if: success()
        env:
          TG_MANAGER_TOKEN: ${{ vars.TG_MANAGER_TOKEN }}
        run: |
          # 🚨 यहाँ अपना क्लाउडफ्लेयर वर्कर का असली नाम डालें 🚨
          CF_DOMAIN="YOUR-WORKER-NAME.workers.dev" 
          FINAL_URL="https://$CF_DOMAIN/$FOLDER_NAME/playlist.m3u8"
          MESSAGE="✅ *Streaming Ready!*%0A%0A📁 Folder: \`$FOLDER_NAME\`%0A🔗 Stream Link: $FINAL_URL"
          
          if [ ! -z "$MESSAGE_ID" ]; then
            JSON_PAYLOAD=$(jq -n --arg chat "$CHAT_ID" --arg msg "$MESSAGE_ID" --arg text "$MESSAGE" '{chat_id: $chat, message_id: $msg, text:$text, parse_mode: "Markdown"}')
            curl -s -X POST "https://api.telegram.org/bot$TG_MANAGER_TOKEN/editMessageText" -H "Content-Type: application/json" -d "$JSON_PAYLOAD"
          fi

      - name: Send Failure Error Message
        if: failure()
        env:
          TG_MANAGER_TOKEN: ${{ vars.TG_MANAGER_TOKEN }}
        run: |
          if [ ! -z "$MESSAGE_ID" ]; then
            JSON_PAYLOAD=$(jq -n --arg chat "$CHAT_ID" --arg msg "$MESSAGE_ID" '{chat_id: $chat, message_id:$msg, text: "❌ *Process Failed!*\nAn error occurred in GitHub Actions. Check GitHub Logs.", parse_mode: "Markdown"}')
            curl -s -X POST "https://api.telegram.org/bot$TG_MANAGER_TOKEN/editMessageText" -H "Content-Type: application/json" -d "$JSON_PAYLOAD"
          fi
