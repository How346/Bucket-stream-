name: Video Slicer to Private B2

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Video URL'
        required: true
        default: 'https://archive.org/download/BigBuckBunny_328/BigBuckBunny_512kb.mp4'
      folder_name:
        description: 'Folder Name (without spaces)'
        required: true
        default: 'movie1'

jobs:
  process-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Tools (FFmpeg, yt-dlp & Rclone)
        run: |
          echo ">> Installing FFmpeg and Rclone..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rclone

          echo ">> Installing yt-dlp..."
          sudo wget -qO /usr/local/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download Video File
        run: |
          echo ">> Downloading video via yt-dlp..."
          yt-dlp --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -f "best[ext=mp4]/best" \
            -o "input.mp4" "${{ github.event.inputs.video_url }}"
          
          echo ">> Checking downloaded file size..."
          ls -lh input.mp4

      - name: Slice Video via FFmpeg
        run: |
          mkdir -p output
          echo ">> Slicing to .jpg segments..."
          ffmpeg -y -i input.mp4 -map 0:v:0 -map 0:a:0? -c copy -start_number 0 -hls_time 4 -hls_list_size 0 -hls_segment_filename "output/seg_%03d.jpg" output/playlist.m3u8
          
          echo ">> Total segments created:"
          ls output | wc -l

      - name: Configure Rclone for Backblaze B2
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [b2remote]
          type = b2
          account = ${{ vars.B2_KEY_ID }}
          key = ${{ vars.B2_APP_KEY }}
          hard_delete = true
          EOF

      - name: Upload to Backblaze via Rclone
        run: |
          echo ">> Uploading all segments with Rclone (Native B2 API - Zero SSL Drops)..."
          rclone copy output/ "b2remote:${{ vars.B2_BUCKET_NAME }}/${{ github.event.inputs.folder_name }}/" \
            --transfers=8 \
            --checkers=16 \
            --retries=5 \
            --low-level-retries=10 \
            --header-upload "Cache-Control: public, max-age=2592000" \
            --stats=5s \
            -v

      - name: Generate Streaming Link
        run: |
          WORKER_BASE="${{ vars.CF_WORKER_URL }}"
          WORKER_BASE="${WORKER_BASE%/}"
          if [ -z "$WORKER_BASE" ]; then
            WORKER_BASE="https://bucket.test-01b.workers.dev"
          fi

          FOLDER="${{ github.event.inputs.folder_name }}"
          PUBLIC_URL="${WORKER_BASE}/${FOLDER}/playlist.m3u8"

          echo ""
          echo "============================================================"
          echo "SUCCESS! 100% UPLOAD COMPLETED WITHOUT SSL ISSUES."
          echo "YOUR PUBLIC M3U8 STREAM LINK:"
          echo "$PUBLIC_URL"
          echo "============================================================"
          echo ""
