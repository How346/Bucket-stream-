name: Video Slicer to Private B2

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Video URL'
        required: true
        default: 'https://archive.org/download/BigBuckBunny_328/BigBuckBunny_512kb.mp4'
      folder_name:
        description: 'Folder Name (without spaces)'
        required: true
        default: 'movie1'

jobs:
  process-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & yt-dlp)
        run: |
          echo ">> Installing FFmpeg..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

          echo ">> Installing Python Boto3..."
          pip install boto3 -q

          echo ">> Installing yt-dlp..."
          sudo wget -qO /usr/local/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download Video File
        run: |
          echo ">> Downloading video via yt-dlp..."
          yt-dlp --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -f "best[ext=mp4]/best" \
            -o "input.mp4" "${{ github.event.inputs.video_url }}"
          
          echo ">> Checking downloaded file size..."
          ls -lh input.mp4

      - name: Slice Video via FFmpeg
        run: |
          mkdir -p output
          echo ">> Slicing to .jpg segments..."
          ffmpeg -y -i input.mp4 -map 0:v:0 -map 0:a:0? -c copy -start_number 0 -hls_time 4 -hls_list_size 0 -hls_segment_filename "output/seg_%03d.jpg" output/playlist.m3u8
          
          echo ">> Total segments created:"
          ls output | wc -l

      - name: Upload to Backblaze Private Bucket
        env:
          KEY_ID: ${{ secrets.B2_KEY_ID }}
          APP_KEY: ${{ secrets.B2_APP_KEY }}
          BUCKET: ${{ secrets.B2_BUCKET_NAME }}
          ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          FOLDER: ${{ github.event.inputs.folder_name }}
        run: |
          python - <<EOF
          import os, sys, boto3
          from concurrent.futures import ThreadPoolExecutor

          raw_endpoint = os.environ.get('ENDPOINT', '').strip()
          key_id = os.environ.get('KEY_ID', '').strip()
          app_key = os.environ.get('APP_KEY', '').strip()
          bucket = os.environ.get('BUCKET', '').strip()

          # चेक करें कि कोई सीक्रेट छूटा तो नहीं है
          missing = []
          if not raw_endpoint: missing.append("B2_ENDPOINT")
          if not key_id: missing.append("B2_KEY_ID")
          if not app_key: missing.append("B2_APP_KEY")
          if not bucket: missing.append("B2_BUCKET_NAME")

          if missing:
              print("\n" + "!"*60)
              print(f"[CRITICAL ERROR] Missing GitHub Secrets: {', '.join(missing)}")
              print("Please add them in Repo Settings -> Secrets and variables -> Actions")
              print("!"*60 + "\n")
              sys.exit(1)

          # Endpoint ऑटो-फॉर्मेटिंग (https:// और ट्रेलिंग स्लैश हटाना)
          clean_host = raw_endpoint.replace("https://", "").replace("http://", "").strip("/")
          endpoint_url = f"https://{clean_host}"

          print(f">> Connecting to Backblaze endpoint: {endpoint_url}")

          s3 = boto3.client(
              's3',
              endpoint_url=endpoint_url,
              aws_access_key_id=key_id,
              aws_secret_access_key=app_key
          )
          
          folder = os.environ.get('FOLDER', 'movie1').strip()
          files = os.listdir('output')

          def upload_file(filename):
              file_path = os.path.join('output', filename)
              content_type = "image/jpeg" if filename.endswith(".jpg") else "application/vnd.apple.mpegurl"
              s3.upload_file(
                  file_path,
                  bucket,
                  f"{folder}/{filename}",
                  ExtraArgs={
                      "ContentType": content_type,
                      "CacheControl": "public, max-age=2592000"
                  }
              )

          print(f">> Uploading {len(files)} files to Backblaze Private B2 ({bucket})...")
          with ThreadPoolExecutor(max_workers=10) as executor:
              list(executor.map(upload_file, files))
          
          worker_base = os.environ.get('CF_WORKER_URL', '').strip().rstrip('/')
          if not worker_base:
              worker_base = "https://YOUR_WORKER_NAME.workers.dev"
              
          public_stream_url = f"{worker_base}/{folder}/playlist.m3u8"
          
          print("\n" + "="*60)
          print("SUCCESS! ALL SEGMENTS UPLOADED.")
          print("YOUR PUBLIC STREAMING LINK:")
          print(public_stream_url)
          print("="*60 + "\n")
          EOF
