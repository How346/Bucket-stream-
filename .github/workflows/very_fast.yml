      - name: very fast Slice Video via FFmpeg (Ultra-Fast Seek & High Quality)
        run: |
          mkdir -p output
          echo ">> Encoding to Net Mirror Style HLS (2s segments, Fragmented MP4 masked as JPG)..."
          ffmpeg -y -i input.mp4 \
            -map 0:v:0 -map 0:a:0? \
            -c:v libx264 -preset veryfast -crf 20 -maxrate 3500k -bufsize 7000k \
            -c:a aac -b:a 128k \
            -g 48 -keyint_min 48 -sc_threshold 0 \
            -f hls \
            -hls_time 2 -hls_list_size 0 \
            -hls_segment_type fmp4 \
            -hls_fmp4_init_filename "init.jpg" \
            -hls_flags independent_segments \
            -hls_segment_filename "output/seg_%05d.jpg" \
            output/playlist.m3u8
          
          echo ">> Total segments created:"
          ls output | wc -l

      - name: Upload to Backblaze via Rclone (Supercharged Speed)
        env:
          RCLONE_CONFIG_B2REMOTE_TYPE: b2
          RCLONE_CONFIG_B2REMOTE_ACCOUNT: ${{ vars.B2_KEY_ID }}
          RCLONE_CONFIG_B2REMOTE_KEY: ${{ vars.B2_APP_KEY }}
          BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
          FOLDER: ${{ github.event.inputs.folder_name }}
        run: |
          if [ -z "$RCLONE_CONFIG_B2REMOTE_ACCOUNT" ] || [ -z "$RCLONE_CONFIG_B2REMOTE_KEY" ] || [ -z "$BUCKET_NAME" ]; then
            echo "CRITICAL ERROR: MISSING GITHUB VARIABLES!"
            exit 1
          fi

          echo ">> Uploading all segments with Rclone (Native B2 API)..."
          rclone copy output/ "b2remote:${BUCKET_NAME}/${FOLDER}/" \
            --transfers=32 \
            --checkers=32 \
            --fast-list \
            --retries=5 \
            --low-level-retries=10 \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            --stats=5s \
            -v
