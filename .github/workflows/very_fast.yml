name: Video Slicer to Telegram (No Encoding)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Video URL'
        required: true
        default: 'https://archive.org/download/BigBuckBunny_328/BigBuckBunny_512kb.mp4'
      folder_name:
        description: 'Folder Name (e.g. movie1)'
        required: true
        default: 'movie1'

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-requests
          sudo wget -qO /usr/local/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download Video File
        run: |
          yt-dlp --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -f "best[ext=mp4]/best" \
            -o "input.mp4" "${{ github.event.inputs.video_url }}"

      - name: Slice Video (Direct Copy - No Encoding)
        run: |
          mkdir -p output
          ffmpeg -y -i input.mp4 \
            -map_metadata -1 -map 0:v:0 -map 0:a:0? \
            -c copy \
            -start_number 0 -hls_time 10 -hls_list_size 0 \
            -hls_segment_filename "output/seg_%03d.jpg" output/playlist.m3u8

      - name: Upload to Telegram & Create DB
        env:
          TG_BOT_TOKEN: ${{ vars.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          FOLDER: ${{ github.event.inputs.folder_name }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Error: Telegram Variables missing!"
            exit 1
          fi
          
          python3 -c "
          import os, requests, json, shutil, time
          
          TOKEN = os.environ['TG_BOT_TOKEN']
          CHAT_ID = os.environ['TG_CHAT_ID']
          FOLDER = os.environ['FOLDER']
          
          map_data = {}
          os.makedirs('db', exist_ok=True)
          files = sorted(os.listdir('output'))
          
          for filename in files:
              file_path = f'output/{filename}'
              
              if filename.endswith('.m3u8'):
                  shutil.copy(file_path, f'db/{FOLDER}_playlist.m3u8')
                  continue
                  
              success = False
              # जब तक फाइल अपलोड नहीं होती, बॉट आगे नहीं बढ़ेगा
              while not success:
                  with open(file_path, 'rb') as f:
                      url = f'https://api.telegram.org/bot{TOKEN}/sendDocument'
                      response = requests.post(url, data={'chat_id': CHAT_ID}, files={'document': f}).json()
                      
                      if response.get('ok'):
                          map_data[filename] = response['result']['document']['file_id']
                          print(f'Uploaded: {filename}')
                          success = True
                          time.sleep(1) # टेलीग्राम को खुश रखने के लिए हर फाइल के बाद 1 सेकंड का ब्रेक
                      
                      elif response.get('error_code') == 429:
                          wait_time = response.get('parameters', {}).get('retry_after', 5)
                          print(f'Rate Limited! Waiting {wait_time} seconds before retrying {filename}...')
                          time.sleep(wait_time) # टेलीग्राम जितना इंतज़ार करने बोलेगा, उतना रुकेगा
                      
                      else:
                          print(f'Error uploading {filename}: {response}')
                          time.sleep(3) # किसी और एरर पर 3 सेकंड रुककर फिर ट्राई करेगा
          
          with open(f'db/{FOLDER}_map.json', 'w') as f:
              json.dump(map_data, f, indent=4)
          "


      - name: Save DB to GitHub Repo
        run: |
          git config --global user.name "Telegram Bot"
          git config --global user.email "bot@github.com"
          git add db/
          git diff --quiet && git diff --staged --quiet || git commit -m "Updated DB for ${{ github.event.inputs.folder_name }}"
          git push
